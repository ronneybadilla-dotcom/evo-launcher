name: Compilar launcher
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Gathin23/cleanyourtv
          ref: 7b7666ad05a3a62ba25768c51fbf06e9c4e67da5
      - name: Configurar para el Evo
        run: |
          python3 - <<'PY'
          import re
          p = "launcher/app/src/main/res/values/config.xml"
          s = open(p, encoding="utf-8").read()
          def sub(pattern, new):
              global s
              s, n = re.subn(pattern, new, s, count=1, flags=re.S)
              assert n == 1, pattern
          def lista(nombre, paquetes):
              items = "".join("<item>%s</item>" % x for x in paquetes)
              sub(r'<string-array name="%s"[^>]*>.*?</string-array>' % nombre,
                  '<string-array name="%s">%s</string-array>' % (nombre, items))
          lista("dock_apps", ["com.netflix.ninja", "com.google.android.youtube.tv",
                "com.amazon.amazonvideo.livingroom", "com.android.vending"])
          lista("hidden_apps", ["com.tivo.hydra.app", "com.spocky.projengmenu",
                "com.google.android.play.games", "com.google.android.videos"])
          sub(r'<string name="stock_home_redirect"[^>]*></string>',
              '<string name="stock_home_redirect" translatable="false">com.tivo.hydra.app</string>')
          sub(r'<bool name="key_filter">true</bool>', '<bool name="key_filter">false</bool>')
          open(p, "w", encoding="utf-8").write(s)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Compilar
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-evo
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
